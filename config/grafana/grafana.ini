[server]
protocol = http
http_port = 3000
domain = localhost
root_url = %(protocol)s://%(domain)s:%(http_port)s/

[security]
admin_user = admin
# Password will be set via environment variable in production
admin_password = admin
disable_gravatar = true
cookie_secure = false
allow_embedding = true

[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Viewer

[dashboards]
versions_to_keep = 20

[users]
allow_sign_up = false
auto_assign_org = true
auto_assign_org_role = Editor

[auth]
disable_login_form = false

[smtp]
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = true

[metrics]
enabled = true
interval_seconds = 10

[unified_alerting]
enabled = true 