global:
  resolve_timeout: 5m
  slack_api_url: "${SLACK_API_URL}" # Will be replaced by actual URL in production

route:
  group_by: ["alertname", "job", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "slack-notifications"
  routes:
    - match:
        severity: critical
      receiver: "slack-critical"
      group_wait: 0s
      repeat_interval: 1h

receivers:
  - name: "slack-notifications"
    slack_configs:
      - channel: "#datapunk-alerts"
        send_resolved: true
        title: '{{ template "slack.default.title" . }}'
        text: '{{ template "slack.default.text" . }}'
        footer: '{{ template "slack.default.footer" . }}'

  - name: "slack-critical"
    slack_configs:
      - channel: "#datapunk-critical"
        send_resolved: true
        title: '[CRITICAL] {{ template "slack.default.title" . }}'
        text: '{{ template "slack.default.text" . }}'
        footer: '{{ template "slack.default.footer" . }}'

templates:
  - "/etc/alertmanager/template/*.tmpl"
