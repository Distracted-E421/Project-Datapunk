receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"
  jaeger:
    protocols:
      grpc:
        endpoint: "0.0.0.0:14250"
      thrift_http:
        endpoint: "0.0.0.0:14268"
  zipkin:
    endpoint: "0.0.0.0:9411"

processors:
  # General batch processing
  batch:
    timeout: 1s
    send_batch_size: 1024
    send_batch_max_size: 2048
    metadata_keys: ["service.name", "operation"]

  # Memory management
  memory_limiter:
    check_interval: 1s
    limit_mib: 1024
    spike_limit_mib: 128
    ballast_size_mib: 683

  # Resource attribution
  resource:
    attributes:
      - key: deployment.environment
        value: production
        action: upsert
      - key: service.namespace
        value: datapunk
        action: upsert
      - key: service.version
        from_attribute: version
        action: upsert
      - key: host.name
        from_env: HOSTNAME
        action: upsert

  # Service-specific sampling
  probabilistic_sampler:
    hash_seed: 22
    sampling_percentage: 100
    sampling_rules:
      # Data Lake service rules
      - rule: service.name == "lake" && operation == "write"
        sampling_percentage: 80
      - rule: service.name == "lake" && operation == "query"
        sampling_percentage: 30
      - rule: service.name == "lake" && operation == "delete"
        sampling_percentage: 100

      # Stream Processing service rules
      - rule: service.name == "stream" && operation == "process"
        sampling_percentage: 70
      - rule: service.name == "stream" && operation == "aggregate"
        sampling_percentage: 50
      - rule: service.name == "stream" && operation == "transform"
        sampling_percentage: 60

      # API Gateway service rules
      - rule: service.name == "gateway" && http.status_code >= 500
        sampling_percentage: 100
      - rule: service.name == "gateway" && http.route == "/api/v1/*"
        sampling_percentage: 20
      - rule: service.name == "gateway" && operation == "auth"
        sampling_percentage: 80

      # Service Mesh rules
      - rule: service.name == "mesh" && operation == "route"
        sampling_percentage: 30
      - rule: service.name == "mesh" && operation == "loadbalance"
        sampling_percentage: 50
      - rule: service.name == "mesh" && operation == "circuitbreaker"
        sampling_percentage: 100

  # Attribute processor for span enrichment
  attributes:
    actions:
      - key: environment
        value: production
        action: upsert
      - key: service.version
        from_attribute: version
        action: upsert
      - key: deployment.name
        value: datapunk
        action: upsert
      - key: error
        from_attribute: "http.status_code"
        action: upsert
        operations:
          - pattern: ">= 400"
            value: true

  # Span processor for error tracking
  span:
    name:
      to_attributes:
        rules:
          - ^\/api\/v1\/.*
          - ^\/health\/.*
    status:
      code:
        error:
          - http.status_code >= 500
          - error.type exists
    attributes:
      include:
        match_type: regexp
        services:
          - lake
          - stream
          - gateway
          - mesh

exporters:
  jaeger:
    endpoint: "jaeger-collector:14250"
    tls:
      insecure: true
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: "datapunk"
    const_labels:
      deployment: "production"
    send_timestamps: true
    metric_expiration: 180m
    resource_to_telemetry_conversion:
      enabled: true
  logging:
    loglevel: debug
    sampling_initial: 5
    sampling_thereafter: 200
    verbosity: detailed

extensions:
  health_check:
    endpoint: "0.0.0.0:13133"
    path: "/health"
    check_collector_pipeline:
      enabled: true
      interval: 5s
      exporter_failure_threshold: 5
  pprof:
    endpoint: "0.0.0.0:1777"
    block_profile_fraction: 0
    mutex_profile_fraction: 0
  zpages:
    endpoint: "0.0.0.0:55679"

service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    traces:
      receivers: [otlp, jaeger, zipkin]
      processors:
        [
          memory_limiter,
          attributes,
          span,
          batch,
          resource,
          probabilistic_sampler,
        ]
      exporters: [jaeger, logging]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [prometheus, logging]
